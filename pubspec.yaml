name: commit
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.3
  google_fonts: ^8.2.1
  home_widget: ^0.10.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  audioplayers: ^6.5.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon_full.png"
  image_path_ios: "assets/brand/icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/brand/icon_background.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_monochrome.png"
